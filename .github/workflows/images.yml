name: Python Images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Python ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.version }} \
            --build-arg PYTHON_DISTRO=slim \
            -t python-test:${{ matrix.version }} .

      - name: Test Python and Pterodactyl environment
        run: |
          docker run --rm \
            -e STARTUP='python -c "import sys; print(sys.version)"' \
            python-test:${{ matrix.version }}

          docker run --rm \
            --entrypoint python \
            python-test:${{ matrix.version }} \
            -c "import os,sys; assert sys.version_info[:2] == tuple(map(int,'${{ matrix.version }}'.split('.'))); assert os.getuid() == 1000; assert os.getcwd() == '/home/container'"

          docker run --rm \
            --entrypoint python \
            python-test:${{ matrix.version }} \
            -m pip --version

  publish:
    name: Publish Python ${{ matrix.version }}
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.version }}
            PYTHON_DISTRO=slim
          tags: ghcr.io/akaanakbaik/image-python:python_${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/akaanakbaik/image-python
            org.opencontainers.image.description=Python Docker image for Pterodactyl
          provenance: true
          sbom: true
